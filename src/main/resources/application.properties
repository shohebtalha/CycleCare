spring.application.name=CycleCare
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is managed per-profile: local uses 'update' (Flyway off), prod uses 'validate' (Flyway on).
# This base value is never active when a profile is set, but is 'none' to be safe.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.mvc.hiddenmethod.filter.enabled=true
spring.web.resources.cache.cachecontrol.max-age=${STATIC_CACHE_MAX_AGE:0}
spring.web.resources.cache.cachecontrol.cache-public=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

server.servlet.session.timeout=45m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

cyclecare.security.remember-me-key=${REMEMBER_ME_KEY:dev-cyclecare-change-me}
cyclecare.rate-limit.auth-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:12}
cyclecare.rate-limit.assistant-per-minute=${ASSISTANT_RATE_LIMIT_PER_MINUTE:20}

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.base-url=${APP_BASE_URL:}

gemini.api.key=${GEMINI_API_KEY:}

cyclecare.ml.enabled=${CYCLECARE_ML_ENABLED:true}
cyclecare.ml.base-url=${CYCLECARE_ML_BASE_URL:http://localhost:8000}
