<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Journal', ~{::section})}">
<section>
    <div class="page-header">
        <div>
            <div class="eyebrow">Daily journal</div>
            <h1>Nutrition & Wellness Journal</h1>        </div>
    </div>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="surface h-100">
                <form th:action="@{/journal}" th:object="${journalEntryDto}" method="post" class="vstack gap-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div>
                        <div class="section-title">
                            <i data-lucide="calendar-days"></i>
                            <span>Date</span>
                        </div>
                        <input id="entryDate" th:field="*{entryDate}" type="date" class="form-control" required>
                        <div class="invalid-copy" th:errors="*{entryDate}"></div>
                    </div>
                    <div>

                        <div class="section-title">
                            <i data-lucide="utensils-crossed"></i>
                            <span>Nutrition Log</span>
                        </div>
                        <div class="nutrition-card">

                        <div class="mb-3">
                            <label class="form-label"> Breakfast</label>
                            <textarea id="breakfast"
                                      class="form-control nutrition-input"
                                      rows="1"
                                      placeholder="What did you eat?"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Lunch</label>
                            <textarea id="lunch"
                                      class="form-control nutrition-input"
                                      rows="1"
                                      placeholder="What did you eat?"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Snacks</label>
                            <textarea id="snacks"
                                      class="form-control nutrition-input"
                                      rows="1"
                                      placeholder="Tea, fruits, biscuits..."></textarea>
                        </div>

                        <div>
                            <label class="form-label"> Dinner</label>
                            <textarea id="dinner"
                                      class="form-control nutrition-input"
                                      rows="1"
                                      placeholder="What did you eat?"></textarea>
                        </div>
                    </div>
                        <!-- Hidden field sent to Spring -->
                        <input
                                type="hidden"
                                id="nutritionLog"
                                name="nutritionLog"
                                th:field="*{nutritionLog}">

                    </div>

                    <div>
                        <div class="section-title">
                            <i data-lucide="notebook-pen"></i>
                            <span>Additional Notes</span>
                        </div>                        <textarea id="observations" th:field="*{observations}" class="form-control" rows="4" placeholder="Anything else you'd like to remember today?"></textarea>
                        <div class="invalid-copy" th:errors="*{observations}"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">
                        <i data-lucide="save"></i>
                        Save journal
                    </button>
                </form>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="surface history-card d-flex flex-column">
                <div class="section-title">
                    <i data-lucide="book-open"></i>
                    Journal history
                </div>
                <div class="timeline">
                    <div class="timeline-item" th:each="entry : ${entries}">
                        <strong th:text="${entry.entryDate}">22-06-2026</strong>
                        <div th:if="${entry.nutritionLog != null and !#strings.isEmpty(entry.nutritionLog)}">

                            <p class="mb-1">
                                <strong> Nutrition</strong>
                            </p>

                            <pre class="journal-nutrition-log"
                                 th:text="${entry.nutritionLog}">
                            </pre>

                        </div>

                        <div th:if="${entry.observations != null and !#strings.isEmpty(entry.observations)}">

                            <p class="mb-1">
                                <strong> Additional Notes</strong>
                            </p>

                            <p class="mb-0 text-secondary"
                               th:text="${entry.observations}">
                            </p>

                        </div>
                    </div>
                    <div class="empty-state" th:if="${#lists.isEmpty(entries)}">No journal entries yet.</div>
                </div>
            </div>
        </div>
    </div>
</section>

</html>
