<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Journal', ~{::section})}">
<section>
    <div class="page-header">
        <div>
            <div class="eyebrow">Daily journal</div>
            <h1>Daily Nutrition & Wellness Journal</h1>        </div>
    </div>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="surface h-100">
                <form th:action="@{/journal}" th:object="${journalEntryDto}" method="post" class="vstack gap-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div>
                        <label class="form-label" for="entryDate">Date</label>
                        <input id="entryDate" th:field="*{entryDate}" type="date" class="form-control" required>
                        <div class="invalid-copy" th:errors="*{entryDate}"></div>
                    </div>
                    <div>

                        <label class="form-label">
                            🍽 Nutrition Log
                        </label>

                        <div class="mb-3">
                            <label class="form-label">🍳 Breakfast</label>
                            <textarea id="breakfast"
                                      class="form-control nutrition-input"
                                      rows="2"
                                      placeholder="What did you eat?"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">🥗 Lunch</label>
                            <textarea id="lunch"
                                      class="form-control nutrition-input"
                                      rows="2"
                                      placeholder="What did you eat?"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">🍎 Snacks</label>
                            <textarea id="snacks"
                                      class="form-control nutrition-input"
                                      rows="2"
                                      placeholder="Tea, fruits, biscuits..."></textarea>
                        </div>

                        <div>
                            <label class="form-label">🍛 Dinner</label>
                            <textarea id="dinner"
                                      class="form-control nutrition-input"
                                      rows="2"
                                      placeholder="What did you eat?"></textarea>
                        </div>

                        <!-- Hidden field sent to Spring -->
                        <textarea
                                id="nutritionLog"
                                th:field="*{nutritionLog}"
                                hidden>
    </textarea>

                    </div>

                    <div>
                        <label class="form-label" for="observations">Additional Notes</label>
                        <textarea id="observations" th:field="*{observations}" class="form-control" rows="4"></textarea>
                        <div class="invalid-copy" th:errors="*{observations}"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">
                        <i data-lucide="save"></i>
                        Save journal
                    </button>
                </form>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="surface">
                <div class="section-title">
                    <i data-lucide="book-open"></i>
                    Journal history
                </div>
                <div class="timeline">
                    <div class="timeline-item" th:each="entry : ${entries}">
                        <strong th:text="${entry.entryDate}">2026-06-22</strong>
                        <p class="mb-1" th:text="${entry.physicalSymptoms}">Physical notes</p>
                        <p class="mb-1 text-secondary" th:text="${entry.emotionalState}">Emotional notes</p>
                        <p class="mb-0 text-secondary" th:text="${entry.observations}">Observations</p>
                    </div>
                    <div class="empty-state" th:if="${#lists.isEmpty(entries)}">No journal entries yet.</div>
                </div>
            </div>
        </div>
    </div>
    <script>

        document.querySelector("form").addEventListener("submit", function () {

            const nutrition =
                `Breakfast:
${document.getElementById("breakfast").value.trim()}

Lunch:
${document.getElementById("lunch").value.trim()}

Snacks:
${document.getElementById("snacks").value.trim()}

Dinner:
${document.getElementById("dinner").value.trim()}`;

            document.getElementById("nutritionLog").value = nutrition;

        });

    </script>
</section>

</html>
