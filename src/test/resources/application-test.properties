spring.datasource.url=jdbc:h2:mem:cyclecare;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

cyclecare.security.remember-me-key=test-remember-me-key
cyclecare.rate-limit.auth-per-minute=5
cyclecare.rate-limit.assistant-per-minute=3
app.base-url=https://cyclecare.example.com
gemini.api.key=
